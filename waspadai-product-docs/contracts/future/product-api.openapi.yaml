# STATUS: FUTURE / NON-RUNTIME CONTRACT.
# This legacy Product Backend draft is preserved for design review only.
# The current Android MVP contract is ../current/android-api-contract.md.
components:
  schemas:
    AIResult:
      $ref: '#/components/schemas/VerificationResponse'
    Action:
      $ref: '#/components/schemas/RecommendedAction'
    Claim:
      additionalProperties: false
      properties:
        claim_expires_at:
          format: date-time
          type: string
        claimed:
          type: boolean
        contribution_id:
          format: uuid
          type: string
        revision:
          minimum: 1
          type: integer
      required:
      - contribution_id
      - claimed
      - claim_expires_at
      - revision
      type: object
    CommunityDetail:
      additionalProperties: false
      properties:
        case_id:
          format: uuid
          type: string
        counts:
          additionalProperties: false
          properties:
            DIBANTAH:
              minimum: 0
              type: integer
            DIDUKUNG:
              minimum: 0
              type: integer
          required:
          - DIDUKUNG
          - DIBANTAH
          type: object
        published_at:
          format: date-time
          type: string
        redacted_image_url:
          anyOf:
          - format: uri
            type: string
          - type: 'null'
        redacted_text:
          type: string
        result:
          $ref: '#/components/schemas/AIResult'
        status:
          enum:
          - PUBLISHED_UNVERIFIED
          - VERIFIED_EVIDENCE
          type: string
        title:
          type: string
        user_vote:
          anyOf:
          - enum:
            - DIDUKUNG
            - DIBANTAH
            type: string
          - type: 'null'
        execution_mode:
          type: string
          enum:
          - REMOTE
          - MOCK
          description: Product execution provenance; synthetic fixture has MOCK even
            though strict upstream result.mode is LIVE.
      required:
      - case_id
      - title
      - redacted_text
      - status
      - published_at
      - counts
      - redacted_image_url
      - result
      - user_vote
      - execution_mode
      type: object
    CommunityItem:
      additionalProperties: false
      properties:
        case_id:
          format: uuid
          type: string
        counts:
          additionalProperties: false
          properties:
            DIBANTAH:
              minimum: 0
              type: integer
            DIDUKUNG:
              minimum: 0
              type: integer
          required:
          - DIDUKUNG
          - DIBANTAH
          type: object
        published_at:
          format: date-time
          type: string
        redacted_text:
          type: string
        status:
          enum:
          - PUBLISHED_UNVERIFIED
          - VERIFIED_EVIDENCE
          type: string
        title:
          type: string
      required:
      - case_id
      - title
      - redacted_text
      - status
      - published_at
      - counts
      type: object
    CommunityPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/CommunityItem'
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - next_cursor
      type: object
    CommunityState:
      additionalProperties: false
      properties:
        case_id:
          format: uuid
          type: string
        community_state:
          enum:
          - PRIVATE
          - PUBLISHED_UNVERIFIED
          - VERIFIED_EVIDENCE
          - WITHDRAWN
          type: string
        revision:
          minimum: 1
          type: integer
      required:
      - case_id
      - community_state
      - revision
      type: object
    Contribution:
      additionalProperties: false
      properties:
        case_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
        contribution_id:
          format: uuid
          type: string
        created_at:
          format: date-time
          type: string
        reasoning:
          type: string
        revision:
          minimum: 1
          type: integer
        sources:
          items:
            $ref: '#/components/schemas/SourceInput'
          type: array
        status:
          enum:
          - DRAFT
          - SUBMITTED
          - NEEDS_EVIDENCE
          - VERIFIED
          - REJECTED
          - RETRACTED
          type: string
        summary:
          type: string
        title:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
      - contribution_id
      - case_id
      - title
      - summary
      - reasoning
      - status
      - revision
      - sources
      - created_at
      - updated_at
      type: object
    ContributionCreate:
      additionalProperties: false
      properties:
        case_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
        reasoning:
          maxLength: 5000
          minLength: 1
          type: string
        sources:
          items:
            $ref: '#/components/schemas/SourceInput'
          type: array
        summary:
          maxLength: 5000
          minLength: 1
          type: string
        title:
          maxLength: 200
          minLength: 1
          type: string
      required:
      - title
      - summary
      - reasoning
      - sources
      type: object
    ContributionPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Contribution'
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - next_cursor
      type: object
    ContributionPatch:
      additionalProperties: false
      minProperties: 2
      properties:
        expected_revision:
          minimum: 1
          type: integer
        reasoning:
          maxLength: 5000
          minLength: 1
          type: string
        sources:
          items:
            $ref: '#/components/schemas/SourceInput'
          type: array
        summary:
          maxLength: 5000
          minLength: 1
          type: string
        title:
          maxLength: 200
          minLength: 1
          type: string
      required:
      - expected_revision
      type: object
    DecisionRequest:
      additionalProperties: false
      properties:
        action:
          enum:
          - VERIFY
          - REJECT
          - NEEDS_EVIDENCE
          - RETRACT
          type: string
        allow_rag:
          type: boolean
        evidence_ids:
          items:
            format: uuid
            type: string
          type: array
        expected_revision:
          minimum: 1
          type: integer
        publish_to_connection:
          type: boolean
        reason:
          maxLength: 5000
          minLength: 1
          type: string
      required:
      - expected_revision
      - action
      - reason
      - evidence_ids
      - publish_to_connection
      - allow_rag
      type: object
    DecisionResult:
      additionalProperties: false
      properties:
        contribution_id:
          format: uuid
          type: string
        created_at:
          format: date-time
          type: string
        decision_id:
          format: uuid
          type: string
        revision:
          minimum: 1
          type: integer
        status:
          enum:
          - NEEDS_EVIDENCE
          - VERIFIED
          - REJECTED
          - RETRACTED
          type: string
        sync_state:
          enum:
          - NOT_REQUESTED
          - PENDING
          - BLOCKED
          - DEINDEX_PENDING
          type: string
      required:
      - decision_id
      - contribution_id
      - status
      - revision
      - sync_state
      - created_at
      type: object
    Dimensions:
      $ref: '#/components/schemas/AssessmentDimensions'
    Error:
      additionalProperties: false
      properties:
        error:
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              format: uuid
              type: string
            retry_after_seconds:
              anyOf:
              - minimum: 0
                type: integer
              - type: 'null'
            retryable:
              type: boolean
          required:
          - code
          - message
          - request_id
          - retryable
          - retry_after_seconds
          type: object
      required:
      - error
      type: object
    Evidence:
      properties:
        id:
          type: string
          title: Id
        claim_id:
          type: string
          title: Claim Id
        source_type:
          type: string
          title: Source Type
        publisher:
          type: string
          title: Publisher
        title:
          type: string
          title: Title
        url:
          type: string
          title: Url
        published_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Published At
        retrieved_at:
          type: string
          title: Retrieved At
        excerpt:
          type: string
          title: Excerpt
        relevance:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Relevance
        authority:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Authority
        recency:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Recency
        stance:
          type: string
          enum:
          - SUPPORTS
          - REFUTES
          - CONTEXT
          - UNKNOWN
          title: Stance
        verification_status:
          type: string
          enum:
          - VERIFIED
          - REVIEWED
          - UNVERIFIED
          title: Verification Status
      additionalProperties: false
      type: object
      required:
      - id
      - claim_id
      - source_type
      - publisher
      - title
      - url
      - published_at
      - retrieved_at
      - excerpt
      - relevance
      - authority
      - recency
      - stance
      - verification_status
      title: Evidence
    Health:
      additionalProperties: false
      properties:
        service:
          enum:
          - product
          type: string
        status:
          enum:
          - ok
          type: string
        version:
          type: string
      required:
      - status
      - service
      - version
      type: object
    HistoryDetail:
      additionalProperties: false
      properties:
        history:
          $ref: '#/components/schemas/HistoryMeta'
        image_url:
          anyOf:
          - format: uri
            type: string
          - type: 'null'
        request_id:
          format: uuid
          type: string
        result:
          $ref: '#/components/schemas/AIResult'
        status:
          enum:
          - COMPLETED
          type: string
        execution_mode:
          type: string
          enum:
          - REMOTE
          - MOCK
          description: Product execution provenance; synthetic fixture has MOCK even
            though strict upstream result.mode is LIVE.
      required:
      - request_id
      - status
      - history
      - result
      - execution_mode
      type: object
    HistoryItem:
      additionalProperties: false
      properties:
        case_id:
          format: uuid
          type: string
        community_state:
          type: string
        created_at:
          format: date-time
          type: string
        headline:
          type: string
        input_type:
          enum:
          - TEXT
          - IMAGE
          type: string
        requires_human_review:
          type: boolean
        verdict:
          type: string
      required:
      - case_id
      - input_type
      - headline
      - verdict
      - requires_human_review
      - community_state
      - created_at
      type: object
    HistoryMeta:
      additionalProperties: false
      properties:
        case_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
        community_eligible:
          type: boolean
        community_state:
          enum:
          - PRIVATE
          - PUBLISHED_UNVERIFIED
          - VERIFIED_EVIDENCE
          - WITHDRAWN
          - NOT_AVAILABLE
          type: string
        save_reason:
          enum:
          - UNVERIFIED
          - HUMAN_REVIEW
          - ALL_POLICY
          - NOT_REQUIRED
          - SAVE_FAILED
          type: string
        saved:
          type: boolean
      required:
      - saved
      - case_id
      - save_reason
      - community_eligible
      - community_state
      type: object
    HistoryPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/HistoryItem'
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - next_cursor
      type: object
    ImageRequest:
      properties:
        image:
          type: string
          format: binary
          title: Image
          description: 'Product policy: JPEG/PNG/WEBP; max8,000,000 bytes, min64x64,
            max6000x6000, max30M pixels. Runtime AI limits not encoded by upstream
            schema.'
        question:
          type: string
          title: Question
          default: Apakah informasi dalam gambar ini benar dan aman ditindaklanjuti?
          maxLength: 500
      type: object
      required:
      - image
      title: ProductImageRequest
    Lesson:
      additionalProperties: false
      properties:
        body_md:
          type: string
        completed:
          type: boolean
        display_order:
          minimum: 0
          type: integer
        duration_minutes:
          minimum: 1
          type: integer
        lesson_id:
          format: uuid
          type: string
        title:
          type: string
      required:
      - lesson_id
      - title
      - body_md
      - duration_minutes
      - display_order
      - completed
      type: object
    Me:
      additionalProperties: false
      properties:
        capabilities:
          additionalProperties: false
          properties:
            community:
              type: boolean
            community_rag:
              type: boolean
            learning:
              type: boolean
            verification:
              type: boolean
          required:
          - verification
          - community
          - learning
          - community_rag
          type: object
        roles:
          items:
            enum:
            - USER
            - MODERATOR
            - ADMIN
            type: string
          type: array
        user_id:
          format: uuid
          type: string
      required:
      - user_id
      - roles
      - capabilities
      type: object
    ModuleDetail:
      additionalProperties: false
      properties:
        lessons:
          items:
            $ref: '#/components/schemas/Lesson'
          type: array
        module_id:
          format: uuid
          type: string
        progress_percent:
          maximum: 100
          minimum: 0
          type: number
        slug:
          type: string
        summary:
          type: string
        title:
          type: string
        version:
          minimum: 1
          type: integer
      required:
      - module_id
      - slug
      - title
      - summary
      - version
      - progress_percent
      - lessons
      type: object
    ModulePage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/ModuleSummary'
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - next_cursor
      type: object
    ModuleSummary:
      additionalProperties: false
      properties:
        module_id:
          format: uuid
          type: string
        progress_percent:
          maximum: 100
          minimum: 0
          type: number
        slug:
          type: string
        summary:
          type: string
        title:
          type: string
        version:
          minimum: 1
          type: integer
      required:
      - module_id
      - slug
      - title
      - summary
      - version
      - progress_percent
      type: object
    Preview:
      additionalProperties: false
      properties:
        confirmation_required:
          enum:
          - true
          type: boolean
        expires_at:
          format: date-time
          type: string
        preview_id:
          format: uuid
          type: string
        redacted_image_url:
          anyOf:
          - format: uri
            type: string
          - type: 'null'
        redacted_text:
          type: string
        redactions:
          items:
            type: string
          type: array
      required:
      - preview_id
      - expires_at
      - redacted_text
      - redacted_image_url
      - redactions
      - confirmation_required
      type: object
    Profile:
      additionalProperties: false
      properties:
        avatar_url:
          anyOf:
          - format: uri
            type: string
          - type: 'null'
        bio:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
        display_name:
          maxLength: 80
          minLength: 1
          type: string
        locale:
          type: string
      required:
      - display_name
      - bio
      - locale
      - avatar_url
      type: object
    ProfilePatch:
      additionalProperties: false
      minProperties: 1
      properties:
        bio:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
        display_name:
          maxLength: 80
          minLength: 1
          type: string
        locale:
          type: string
      required: []
      type: object
    Progress:
      additionalProperties: false
      properties:
        best_score:
          anyOf:
          - maximum: 100
            minimum: 0
            type: number
          - type: 'null'
        completed_lessons:
          minimum: 0
          type: integer
        latest_score:
          anyOf:
          - maximum: 100
            minimum: 0
            type: number
          - type: 'null'
        module_id:
          format: uuid
          type: string
        progress_percent:
          maximum: 100
          minimum: 0
          type: number
        total_lessons:
          minimum: 0
          type: integer
        updated_at:
          format: date-time
          type: string
      required:
      - module_id
      - completed_lessons
      - total_lessons
      - progress_percent
      - latest_score
      - best_score
      - updated_at
      type: object
    ProgressPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Progress'
          type: array
      required:
      - items
      type: object
    PublishRequest:
      additionalProperties: false
      properties:
        publication_consent:
          enum:
          - true
          type: boolean
        rag_reuse_consent:
          type: boolean
        preview_id:
          format: uuid
          type: string
      required:
      - preview_id
      - publication_consent
      - rag_reuse_consent
      type: object
    Quiz:
      additionalProperties: false
      properties:
        module_id:
          format: uuid
          type: string
        module_version:
          minimum: 1
          type: integer
        questions:
          items:
            $ref: '#/components/schemas/QuizQuestion'
          type: array
      required:
      - module_id
      - module_version
      - questions
      type: object
    QuizFeedback:
      additionalProperties: false
      properties:
        correct:
          type: boolean
        explanation:
          type: string
        question_id:
          format: uuid
          type: string
      required:
      - question_id
      - correct
      - explanation
      type: object
    QuizOption:
      additionalProperties: false
      properties:
        option_id:
          format: uuid
          type: string
        text:
          type: string
      required:
      - option_id
      - text
      type: object
    QuizQuestion:
      additionalProperties: false
      properties:
        options:
          items:
            $ref: '#/components/schemas/QuizOption'
          type: array
        question_id:
          format: uuid
          type: string
        text:
          type: string
      required:
      - question_id
      - text
      - options
      type: object
    QuizRequest:
      additionalProperties: false
      properties:
        answers:
          items:
            additionalProperties: false
            properties:
              option_id:
                format: uuid
                type: string
              question_id:
                format: uuid
                type: string
            required:
            - question_id
            - option_id
            type: object
          minItems: 1
          type: array
        module_version:
          minimum: 1
          type: integer
      required:
      - module_version
      - answers
      type: object
    QuizResult:
      additionalProperties: false
      properties:
        attempt_id:
          format: uuid
          type: string
        correct_answers:
          minimum: 0
          type: integer
        feedback:
          items:
            $ref: '#/components/schemas/QuizFeedback'
          type: array
        score:
          maximum: 100
          minimum: 0
          type: number
        total_questions:
          minimum: 1
          type: integer
      required:
      - attempt_id
      - score
      - correct_answers
      - total_questions
      - feedback
      type: object
    Ready:
      additionalProperties: false
      properties:
        request_id:
          format: uuid
          type: string
        status:
          enum:
          - ready
          - degraded
          type: string
      required:
      - status
      - request_id
      type: object
    Revision:
      additionalProperties: false
      properties:
        expected_revision:
          minimum: 1
          type: integer
      required:
      - expected_revision
      type: object
    SourceInput:
      additionalProperties: false
      properties:
        note:
          maxLength: 2000
          type: string
        publisher:
          maxLength: 200
          type: string
        source_url:
          format: uri
          maxLength: 2048
          type: string
        title:
          maxLength: 300
          type: string
      required:
      - source_url
      type: object
    TextRequest:
      properties:
        text:
          type: string
          maxLength: 25000
          minLength: 10
          title: Text
        question:
          type: string
          maxLength: 500
          title: Question
          default: Apakah isi teks ini benar dan aman ditindaklanjuti?
        source_url:
          anyOf:
          - type: string
            maxLength: 2048
            format: uri
          - type: 'null'
          title: Source Url
        sender_context:
          type: string
          enum:
          - NOT_APPLICABLE
          - UNKNOWN_NUMBER
          - KNOWN_CONTACT
          - FORWARDED
          - SOCIAL_MEDIA
          - UNKNOWN
          title: Sender Context
          default: UNKNOWN
        page_context:
          anyOf:
          - $ref: '#/components/schemas/PageContext'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - text
      title: ProductTextRequest
    VerificationEnvelope:
      additionalProperties: false
      properties:
        history:
          $ref: '#/components/schemas/HistoryMeta'
        request_id:
          format: uuid
          type: string
        result:
          $ref: '#/components/schemas/AIResult'
        status:
          enum:
          - COMPLETED
          type: string
        execution_mode:
          type: string
          enum:
          - REMOTE
          - MOCK
          description: Product execution provenance; synthetic fixture has MOCK even
            though strict upstream result.mode is LIVE.
      required:
      - request_id
      - status
      - history
      - result
      - execution_mode
      type: object
    VoteRequest:
      additionalProperties: false
      properties:
        vote:
          enum:
          - DIDUKUNG
          - DIBANTAH
          type: string
      required:
      - vote
      type: object
    VoteResult:
      additionalProperties: false
      properties:
        case_id:
          format: uuid
          type: string
        counts:
          additionalProperties: false
          properties:
            DIBANTAH:
              minimum: 0
              type: integer
            DIDUKUNG:
              minimum: 0
              type: integer
          required:
          - DIDUKUNG
          - DIBANTAH
          type: object
        user_vote:
          anyOf:
          - enum:
            - DIDUKUNG
            - DIBANTAH
            type: string
          - type: 'null'
      required:
      - case_id
      - user_vote
      - counts
      type: object
    AssessmentDimensions:
      properties:
        factual_status:
          anyOf:
          - type: string
            enum:
            - SUPPORTED
            - REFUTED
            - MISLEADING
            - PARTLY_TRUE
            - OUTDATED
            - UNVERIFIED
            - SATIRE
            - OPINION
          - type: string
            const: NOT_APPLICABLE
          title: Factual Status
        source_authenticity:
          type: string
          enum:
          - VERIFIED
          - UNVERIFIED
          - SUSPICIOUS
          - NOT_APPLICABLE
          title: Source Authenticity
        sender_identity:
          type: string
          enum:
          - VERIFIED
          - UNVERIFIED
          - IMPERSONATION_LIKELY
          - IMPERSONATION_CONFIRMED
          - NOT_APPLICABLE
          title: Sender Identity
        channel_status:
          type: string
          enum:
          - VERIFIED
          - UNVERIFIED
          - SUSPICIOUS
          - MALICIOUS
          - NOT_APPLICABLE
          title: Channel Status
        scam_risk:
          type: string
          enum:
          - CRITICAL
          - HIGH
          - MEDIUM
          - LOW
          - UNKNOWN
          title: Scam Risk
        content_authenticity:
          type: string
          enum:
          - ORIGINAL
          - ALTERED
          - SYNTHETIC
          - UNVERIFIED
          - NOT_APPLICABLE
          title: Content Authenticity
      additionalProperties: false
